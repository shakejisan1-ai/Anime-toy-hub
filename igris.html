<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Igris - Anime Toy Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080812;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:20px;
  background:#141421;
}

.back{
  color:#aaa;
  text-decoration:none;
}

.container{
  padding:20px;
}

.product{
  background:#151522;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #29293b;
}

.main-image{
  width:100%;
  height:330px;
  display:block;
  object-fit:cover;
  background:#202030;
}

.gallery{
  display:flex;
  gap:10px;
  padding:12px;
  overflow-x:auto;
}

.gallery button{
  border:0;
  padding:0;
  background:none;
}

.gallery img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #33334a;
}

.info{
  padding:20px;
}

h1{
  font-size:28px;
}

.anime{
  color:#a855f7;
  margin-top:8px;
}

.description{
  color:#aaa;
  line-height:1.6;
  margin-top:15px;
}

.price{
  font-size:24px;
  font-weight:bold;
  margin-top:18px;
}

.available{
  color:#6ee76a;
  margin-top:8px;
}

.button{
  display:block;
  text-align:center;
  margin-top:18px;
  padding:14px;
  background:#7c3aed;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

footer{
  text-align:center;
  color:#777;
  padding:25px;
}
</style>

</head>

<body>

<header>
<a class="back" href="solo-leveling.html">
← Back to Solo Leveling
</a>
</header>

<div class="container">

<div class="product">

<img
id="mainImage"
class="main-image"
src="https://placehold.co/800x600/202030/ffffff?text=IGRIS+FIGURE"
alt="Igris Figure"
>

<div class="gallery">

<button onclick="showImage('https://placehold.co/800x600/202030/ffffff?text=IGRIS+1')">
<img src="https://placehold.co/150x150/202030/ffffff?text=1">
</button>

<button onclick="showImage('https://placehold.co/800x600/302040/ffffff?text=IGRIS+2')">
<img src="https://placehold.co/150x150/302040/ffffff?text=2">
</button>

<button onclick="showImage('https://placehold.co/800x600/202040/ffffff?text=IGRIS+3')">
<img src="https://placehold.co/150x150/202040/ffffff?text=3">
</button>

<button onclick="showImage('https://placehold.co/800x600/402040/ffffff?text=IGRIS+4')">
<img src="https://placehold.co/150x150/402040/ffffff?text=4">
</button>

</div>

<div class="info">

<h1>⚔️ Igris</h1>

<div class="anime">
Solo Leveling
</div>

<div class="description">
Igris collectible figure inspired by the Solo Leveling universe.
Perfect for anime figure collectors.
</div>

<div class="price">
৳2,500
</div>

<div class="available">
● Available
</div>

<a href="#" class="button">
❤️ Add to My Collection
</a>

</div>

</div>

</div>

<footer>
© 2026 Anime Toy Hub
</footer>

<script>
function showImage(image){
  document.getElementById("mainImage").src = image;
}
</script>

</body>
</html>
