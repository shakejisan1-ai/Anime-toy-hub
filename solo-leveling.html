<style>

body{

    background:#080812;

}

header{
    padding:20px;

.container{
    padding:20px;

.collection{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:#141420;
    border:1px solid #252438;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.info{
    padding:12px;
}

.info h2{
    font-size:17px;
}

.type{
    color:#a855f7;
    font-size:13px;
    margin-top:5px;
}

.button{
    display:block;
    margin-top:10px;
    padding:9px;
    text-align:center;
    background:#7c3aed;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:13px;
}

footer{
    margin-top:30px;
    padding:25px;
    text-align:center;
    color:#777;
    background:#11111c;
    font-size:13px;
}

@media(max-width:350px){
    .collection{
        grid-template-columns:1fr;
    }
}
</style>
</head>
